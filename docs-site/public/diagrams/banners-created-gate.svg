<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="650" viewBox="0 0 1880 650" role="img" aria-labelledby="title description">
<title id="title">banners created gate logic</title>
<desc id="description">Read left to right. Recovery paths appear below their owning step. Return IDs identify where to resume.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<path d="M 360 130 L 500 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<path d="M 820 130 L 960 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="870.45" y="118" width="39.1" height="24" fill="#fff"/>
<text x="890" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Yes</text>
<path d="M 1280 130 L 1420 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1330.45" y="118" width="39.1" height="24" fill="#fff"/>
<text x="1350" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Yes</text>
<path d="M 200 185 L 200 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="107.3" y="250.5" width="185.4" height="24" fill="#fff"/>
<text x="200" y="267.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Unknown / disconnected</text>
<path d="M 660 230 L 660 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="644.3" y="273" width="31.4" height="24" fill="#fff"/>
<text x="660" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">No</text>
<path d="M 1120 230 L 1120 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1104.3" y="273" width="31.4" height="24" fill="#fff"/>
<text x="1120" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">No</text>
<path d="M 1580 185 L 1580 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1518.1" y="250.5" width="123.8" height="24" fill="#fff"/>
<text x="1580" y="267.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Repeated event</text>
<rect x="40" y="75" width="320" height="110" rx="10" fill="#C2E5FF" stroke="#3DADFF"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="200" y="125">AB1 Receive or reconcile</tspan>
<tspan x="200" y="147">Importer receipt</tspan>
</text>
<polygon points="660,30 820,130 660,230 500,130" fill="#FFECBD" stroke="#FFC943"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="660" y="125">AB2 Current handoff</tspan>
<tspan x="660" y="147">receipt?</tspan>
</text>
<polygon points="1120,30 1280,130 1120,230 960,130" fill="#FFECBD" stroke="#FFC943"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="1120" y="125">AB3 All frames</tspan>
<tspan x="1120" y="147">verified + mapped?</tspan>
</text>
<rect x="1420" y="75" width="320" height="110" rx="10" fill="#CDF4D3" stroke="#66D575"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="1580" y="125">AB4 Confirm creation</tspan>
<tspan x="1580" y="147">Show Figma design state</tspan>
</text>
<rect x="40" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="64" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Receipt dependency</text>
<text x="62" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="82" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Keep state A and inspect the</text>
<text x="82" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">same job.</text>
<text x="62" y="452" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="82" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Timeout does not mean failure.</text>
<text x="62" y="480" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="82" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Resume reconciliation at AB1.</text>
<rect x="500" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="524" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Identity dependency</text>
<text x="522" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="542" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Wrong destination, source</text>
<text x="542" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">hash, cancelled or superseded</text>
<text x="542" y="446" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">handoff.</text>
<text x="522" y="474" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="542" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Reject receipt; reconcile</text>
<text x="542" y="496" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">current job at AB1.</text>
<rect x="960" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="984" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Completeness dependency</text>
<text x="982" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Check unique frame mapping,</text>
<text x="1002" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">output IDs and dimensions.</text>
<text x="982" y="452" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Repair missing / wrong frames</text>
<text x="1002" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">at A5;</text>
<text x="982" y="502" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">then recheck AB1.</text>
<rect x="1420" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="1444" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Event ordering</text>
<text x="1442" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Deduplicate accepted receipts.</text>
<text x="1442" y="430" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="430" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Older events cannot reopen or</text>
<text x="1462" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">advance a newer version.</text>
<text x="1442" y="480" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Read current server state.</text>
</svg>
