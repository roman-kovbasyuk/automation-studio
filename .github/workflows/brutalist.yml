name: Brutalist package

on:
  pull_request:
    paths:
      - packages/brutalist-design-system/**
      - package-lock.json
  push:
    branches: [v3]
    paths:
      - packages/brutalist-design-system/**
      - package-lock.json

permissions:
  contents: read

jobs:
  verify:
    name: Package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify --workspace brutalist-design-system
