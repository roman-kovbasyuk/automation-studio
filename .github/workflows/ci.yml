name: CI

on:
  pull_request:
  push:
    branches: [v3]

permissions:
  contents: read

jobs:
  build:
    name: Design-system boundaries and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:design-system
      - run: npm run design-system:check
      - run: npm run build
