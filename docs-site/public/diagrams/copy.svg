<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="650" viewBox="0 0 2800 650" role="img" aria-labelledby="title description">
<title id="title">copy logic</title>
<desc id="description">Read left to right. Recovery paths appear below their owning step. Return IDs identify where to resume.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<path d="M 360 130 L 500 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="398.9" y="118" width="62.2" height="24" fill="#fff"/>
<text x="430" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Result</text>
<path d="M 820 130 L 960 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="870.45" y="118" width="39.1" height="24" fill="#fff"/>
<text x="890" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Yes</text>
<path d="M 1280 130 L 1420 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1322.75" y="118" width="54.5" height="24" fill="#fff"/>
<text x="1350" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Saved</text>
<path d="M 1740 130 L 1880 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1771.2" y="118" width="77.6" height="24" fill="#fff"/>
<text x="1810" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Continue</text>
<path d="M 2200 130 L 2340 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="2250.45" y="118" width="39.1" height="24" fill="#fff"/>
<text x="2270" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Yes</text>
<path d="M 200 185 L 200 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="130.4" y="250.5" width="139.2" height="24" fill="#fff"/>
<text x="200" y="267.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Failed / unknown</text>
<path d="M 660 230 L 660 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="644.3" y="273" width="31.4" height="24" fill="#fff"/>
<text x="660" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">No</text>
<path d="M 1120 185 L 1120 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1073.5" y="250.5" width="93" height="24" fill="#fff"/>
<text x="1120" y="267.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Save fails</text>
<path d="M 1580 185 L 1580 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1495" y="250.5" width="170" height="24" fill="#fff"/>
<text x="1580" y="267.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">More / upstream edit</text>
<path d="M 2040 230 L 2040 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="2024.3" y="273" width="31.4" height="24" fill="#fff"/>
<text x="2040" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">No</text>
<rect x="40" y="75" width="320" height="110" rx="10" fill="#C2E5FF" stroke="#3DADFF"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="200" y="125">C1 Generate five</tspan>
<tspan x="200" y="147">copy options</tspan>
</text>
<polygon points="660,30 820,130 660,230 500,130" fill="#FFECBD" stroke="#FFC943"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="660" y="125">C2 Response valid</tspan>
<tspan x="660" y="147">and current?</tspan>
</text>
<rect x="960" y="75" width="320" height="110" rx="10" fill="#C2E5FF" stroke="#3DADFF"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="1120" y="125">C3 Save copy batch</tspan>
<tspan x="1120" y="147">Bound to input snapshot</tspan>
</text>
<rect x="1420" y="75" width="320" height="110" rx="10" fill="#C2E5FF" stroke="#3DADFF"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="1580" y="125">C4 Review and edit</tspan>
<tspan x="1580" y="147">Select copy options</tspan>
</text>
<polygon points="2040,30 2200,130 2040,230 1880,130" fill="#FFECBD" stroke="#FFC943"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="2040" y="125">C5 At least one valid</tspan>
<tspan x="2040" y="147">copy selected?</tspan>
</text>
<rect x="2340" y="75" width="320" height="110" rx="10" fill="#CDF4D3" stroke="#66D575"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="2500" y="125">C6 Copy ready</tspan>
<tspan x="2500" y="147">Next: Visuals conditions</tspan>
</text>
<rect x="40" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="64" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Generation failure</text>
<text x="62" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="82" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Keep brief + existing copy.</text>
<text x="62" y="430" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="82" y="430" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Reconcile timeout; retry only</text>
<text x="82" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">confirmed failure through G1.</text>
<rect x="500" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="524" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Invalid / partial result</text>
<text x="522" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="542" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Blocked, malformed, stale or</text>
<text x="542" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">missing required wording.</text>
<text x="522" y="452" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="542" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Repair via G1. Partial only:</text>
<text x="522" y="480" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="542" y="480" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">explicitly accept valid subset</text>
<text x="542" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">→ C3.</text>
<rect x="960" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="984" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Storage dependency</text>
<text x="982" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Do not mark an unsaved batch</text>
<text x="1002" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">ready.</text>
<text x="982" y="452" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Recover the same job result at</text>
<text x="1002" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">C3;</text>
<text x="982" y="502" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">no new generation.</text>
<rect x="1420" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="1444" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Iteration path</text>
<text x="1442" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">More options: new intent</text>
<text x="1462" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">through G1.</text>
<text x="1442" y="452" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Brief edit: return to B1; keep</text>
<text x="1462" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">copy as drafts and revalidate.</text>
<rect x="1880" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="1904" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Selection dependency</text>
<text x="1902" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1922" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Nothing selected, invalid</text>
<text x="1922" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">edits or stale copy.</text>
<text x="1902" y="452" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1922" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Return to C4; correct and</text>
<text x="1922" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">select.</text>
<text x="1902" y="502" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1922" y="502" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">No tailored visuals requested</text>
<text x="1922" y="524" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">yet.</text>
</svg>
