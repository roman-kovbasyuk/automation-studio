<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="650" viewBox="0 0 2340 650" role="img" aria-labelledby="title description">
<title id="title">visuals to banners logic</title>
<desc id="description">Read left to right. Recovery paths appear below their owning step. Return IDs identify where to resume.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#555" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<path d="M 360 130 L 500 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<path d="M 820 130 L 960 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="870.45" y="118" width="39.1" height="24" fill="#fff"/>
<text x="890" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Yes</text>
<path d="M 1280 130 L 1420 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1330.45" y="118" width="39.1" height="24" fill="#fff"/>
<text x="1350" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Yes</text>
<path d="M 1740 130 L 1880 130" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1790.45" y="118" width="39.1" height="24" fill="#fff"/>
<text x="1810" y="135" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Yes</text>
<path d="M 660 230 L 660 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="644.3" y="273" width="31.4" height="24" fill="#fff"/>
<text x="660" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">No</text>
<path d="M 1120 230 L 1120 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1104.3" y="273" width="31.4" height="24" fill="#fff"/>
<text x="1120" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">No</text>
<path d="M 1580 230 L 1580 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1564.3" y="273" width="31.4" height="24" fill="#fff"/>
<text x="1580" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">No</text>
<path d="M 2040 185 L 2040 340" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<rect x="1951.15" y="250.5" width="177.70000000000002" height="24" fill="#fff"/>
<text x="2040" y="267.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Conflict / save fails</text>
<rect x="40" y="75" width="320" height="110" rx="10" fill="#C2E5FF" stroke="#3DADFF"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="200" y="125">BG1 Request banners</tspan>
<tspan x="200" y="147">From selected pairings</tspan>
</text>
<polygon points="660,30 820,130 660,230 500,130" fill="#FFECBD" stroke="#FFC943"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="660" y="125">BG2 Sources current</tspan>
<tspan x="660" y="147">and valid?</tspan>
</text>
<polygon points="1120,30 1280,130 1120,230 960,130" fill="#FFECBD" stroke="#FFC943"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="1120" y="125">BG3 Outputs defined</tspan>
<tspan x="1120" y="147">and supported?</tspan>
</text>
<polygon points="1580,30 1740,130 1580,230 1420,130" fill="#FFECBD" stroke="#FFC943"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="1580" y="125">BG4 Compositions</tspan>
<tspan x="1580" y="147">render correctly?</tspan>
</text>
<rect x="1880" y="75" width="320" height="110" rx="10" fill="#CDF4D3" stroke="#66D575"/>
<text text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1E1E1E">
<tspan x="2040" y="125">BG5 Save preview set</tspan>
<tspan x="2040" y="147">Enter Banners state A</tspan>
</text>
<rect x="500" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="524" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Source dependency</text>
<text x="522" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="542" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Saved copy, media bytes and</text>
<text x="542" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">brand rules must match current</text>
<text x="542" y="446" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">revisions.</text>
<text x="522" y="474" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="542" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Resolve affected source in</text>
<text x="542" y="496" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Copy / Visuals; return to BG1.</text>
<rect x="960" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="984" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Output dependency</text>
<text x="982" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Choose compatible templates,</text>
<text x="1002" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">sizes, static file types and</text>
<text x="1002" y="446" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">required video.</text>
<text x="982" y="474" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1002" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Unsupported combinations stay</text>
<text x="1002" y="496" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">blocked at BG3.</text>
<rect x="1420" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="1444" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Composition dependency</text>
<text x="1442" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Missing field, text overflow,</text>
<text x="1462" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">wrong crop or unsupported</text>
<text x="1462" y="446" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">size.</text>
<text x="1442" y="474" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Fix the affected preview;</text>
<text x="1462" y="496" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">recheck BG4.</text>
<text x="1442" y="524" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1462" y="524" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Never silently truncate</text>
<text x="1462" y="546" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">content.</text>
<rect x="1880" y="340" width="320" height="280" rx="10" fill="#FFCDC2" stroke="#FF7556"/>
<text x="1904" y="374" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E1E1E">Preview persistence</text>
<text x="1902" y="402" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1922" y="402" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Selection or sources changed</text>
<text x="1922" y="424" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">while saving.</text>
<text x="1902" y="452" font-family="Arial,sans-serif" font-size="16" fill="#1E1E1E">•</text>
<text x="1922" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">Preserve draft; reload current</text>
<text x="1922" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#1E1E1E">revisions and return to BG1.</text>
</svg>
